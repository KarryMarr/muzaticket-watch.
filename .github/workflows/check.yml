name: Check tickets

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test Telegram message"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 check_tickets.py ${{ inputs.test && '--test' || '' }}

      - name: Save state
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "Update ticket state" && git push)
